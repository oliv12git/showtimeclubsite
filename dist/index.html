<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Showtime Club</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #111;
    }

    header {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: white;
      padding: 20px;
    }

    .logo {
      width: 747px;
      max-width: 95%;
      height: 420px;
      border: 2px solid black;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      overflow: hidden;
      background: #ddd;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    section {
      padding: 60px 20px;
    }

    h1, h2, h3 {
      margin-bottom: 10px;
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .player-card {
      background: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      overflow: hidden;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .player-card:hover {
      transform: translateY(-5px);
    }

    .player-photo {
      width: 100%;
      height: 250px;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .player-info {
      padding: 15px;
    }

    .flag {
      font-size: 2rem;
      margin-top: 10px;
      display: block;
    }

    .about {
      max-width: 800px;
      margin: auto;
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    .about p {
      line-height: 1.6;
      margin-top: 15px;
    }

    .scroll-arrow {
      margin-top: 40px;
      font-size: 2rem;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(10px);
      }
    }

    .fade-in {
      opacity: 0;
      transform: translateY(40px);
      transition: all 1s ease;
    }

    .fade-in.show {
      opacity: 1;
      transform: translateY(0);
    }

    footer {
      text-align: center;
      padding: 20px;
      background: white;
      border-top: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <script>
    const fadeElements = document.querySelectorAll('.fade-in');

    function checkScroll() {
      fadeElements.forEach(element => {
        const rect = element.getBoundingClientRect();

        if (rect.top < window.innerHeight - 100) {
          element.classList.add('show');
        }
      });
    }

    window.addEventListener('scroll', checkScroll);
    checkScroll();
  </script>

</body>
